<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Excel</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #fff;
    --text: #1b2330;
    --muted: #5d6a7c;
    --line: #dde2e9;
    --accent: #1f5eff;
    --accent-text: #fff;
    --ok: #17794a;
    --err: #b3261e;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c;
      --card: #1a2029;
      --text: #e8ecf2;
      --muted: #98a4b5;
      --line: #2b3441;
      --accent: #5b8cff;
      --accent-text: #0b1220;
      --ok: #4cc38a;
      --err: #ff8a80;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 16px 64px;
  }

  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
  }

  input[type="file"] {
    display: block;
    margin-bottom: 12px;
    max-width: 100%;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  button {
    font: inherit;
    border: 0;
    border-radius: 6px;
    padding: 10px 18px;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-text);
  }

  button:disabled { opacity: .5; cursor: not-allowed; }


  #status { margin-top: 14px; }
  .ok { color: var(--ok); }
  .err { color: var(--err); }


</style>
</head>
<body>
<main>
  <h1>Upload Excel</h1>
  <p class="lead">Choose an .xlsx or .csv file with the headers Name, Age and Email in row 1. Invalid rows and duplicate emails are skipped and returned in an Excel file.</p>

  <div class="card">
    <input type="file" id="file" accept=".xlsx,.csv">

    <div class="actions">
      <button id="send" type="button">Upload</button>
    </div>

    <div id="status" aria-live="polite"></div>
  </div>

</main>

<script>
const file = document.getElementById('file');
const send = document.getElementById('send');
const status = document.getElementById('status');

// After an upload, Upload stays disabled until a new file is chosen.
// Uploading the same file again would reject every row as a duplicate.
let uploaded = false;

function setBusy(busy) {
  send.disabled = busy || uploaded;
}

file.addEventListener('change', () => {
  uploaded = false;
  status.className = '';
  status.textContent = '';
  setBusy(false);
});

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  // Delay revocation slightly so the browser can begin the download.
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

send.addEventListener('click', async () => {
  if (!file.files[0]) {
    status.className = 'err';
    status.textContent = 'Choose an .xlsx or .csv file first.';
    return;
  }

  const body = new FormData();
  body.append('file', file.files[0]);

  setBusy(true);
  status.className = '';
  status.textContent = 'Uploading and validating…';

  try {
    const res = await fetch('/api/upload', { method: 'POST', body });

    if (!res.ok) {
      let data = {};
      try {
        data = await res.json();
      } catch {
        // Keep the generic error if the server did not return JSON.
      }
      throw new Error(data.error || 'Upload failed.');
    }

    const inserted = Number(res.headers.get('X-Inserted-Rows') || 0);
    const rejected = Number(res.headers.get('X-Rejected-Rows') || 0);

    uploaded = true;
    status.className = 'ok';

    if (rejected === 0) {
      status.textContent = `Saved ${inserted} row(s). No rows were rejected.`;
    } else {
      // The server sent an Excel file with the rejected rows
      downloadBlob(await res.blob(), 'rejected_rows.xlsx');
      status.textContent =
        `Saved ${inserted} row(s). ${rejected} row(s) were rejected; ` +
        `rejected_rows.xlsx has been downloaded with the reason for each.`;
    }
  } catch (error) {
    status.className = 'err';
    status.textContent = error.message || 'Upload failed.';
  } finally {
    setBusy(false);
  }
});
</script>
</body>
</html>
